services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - flowai-mongo:/data/db

volumes:
  flowai-mongo:
